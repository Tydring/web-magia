# Netlify configuration for rafaelgmagia.com

# ── Build ──────────────────────────────────────────────────────
# Static site from repo root + conexiones-app (Next.js static export)
# served at /conexiones. See build.sh.
[build]
  command = "bash build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── Redirects ──────────────────────────────────────────────────
# Force www → apex (optional, uncomment if preferred)
# [[redirects]]
#   from = "https://www.rafaelgmagia.com/*"
#   to   = "https://rafaelgmagia.com/:splat"
#   status = 301
#   force  = true

# ── Security Headers ───────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent site from being embedded in iframes (clickjacking)
    X-Frame-Options = "DENY"

    # Stop browsers from MIME-sniffing the content type
    X-Content-Type-Options = "nosniff"

    # Only send origin in referrer header when navigating inside HTTPS
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Restrict browser features (no camera, microphone, etc.)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

    # Allow Google Fonts + Instagram embeds (embed.js + iframes en
    # /conexiones); todo lo demás restringido al propio origen
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.instagram.com https://*.cdninstagram.com; script-src 'self' 'unsafe-inline' https://www.instagram.com; connect-src 'self' https://www.instagram.com; frame-src https://www.instagram.com; frame-ancestors 'none';"
